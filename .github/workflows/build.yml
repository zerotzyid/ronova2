name: Build FuwaStream

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version name
        run: |
          echo "VERSION_CODE=$((30000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          BASE=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || echo v2.1.0)
          echo "VERSION_NAME=${BASE#v}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Debug + Release APK (split per ABI)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          echo "=== Debug: APK files found ==="
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
          echo "=== Copying debug APKs ==="
          cp app/build/outputs/apk/debug/*armeabi-v7a*.apk dist/FuwaStream-debug-armeabi-v7a.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk dist/FuwaStream-debug-arm64-v8a.apk 2>/dev/null || true
          echo "=== Copying release APKs ==="
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk "dist/FuwaStream-${{ env.VERSION_NAME }}-armeabi-v7a.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/*arm64-v8a*.apk "dist/FuwaStream-${{ env.VERSION_NAME }}-arm64-v8a.apk" 2>/dev/null || true
          echo "=== Debug: dist contents ==="
          ls -la dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: FuwaStream-${{ env.VERSION_NAME }}
          path: dist/*
